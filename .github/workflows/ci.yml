name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t reco-api .

      - name: Run container
        run: docker run -d -p 8000:8000 --name reco-container reco-api

      - name: Wait for API
        run: |
          echo "Waiting for API to start..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is ready!"
              exit 0
            fi
            echo "Attempt $i/30 - waiting 5s..."
            sleep 5
          done
          echo "API failed to start"
          docker logs reco-container
          exit 1

      - name: Test health endpoint
        run: curl --fail http://localhost:8000/health

      - name: Test custom recommendation
        run: |
          curl --fail "http://localhost:8000/recommend/custom/1?k=5"

      - name: Test surprise recommendation
        run: |
          curl --fail "http://localhost:8000/recommend/surprise/1?k=5"

      - name: Stop container
        run: docker stop reco-container
